version: '3.8'

services:
  campspot-checker:
    image: fredcorn/campspot-checker:amd64-latest
    container_name: campspot-checker
    restart: unless-stopped
    ports:
      - 8787:8787
    env_file:
      - .env
    environment:
      - PORT=8787
    volumes:
      # Persist SQLite DB across container recreates. Without this, every
      # `up -d --force-recreate` wipes campgrounds.enabled toggles, the
      # availability_events history, and the cycle-baseline used for dedup.
      - ./data:/usr/src/app/data
